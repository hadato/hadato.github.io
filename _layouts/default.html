<!doctype html>
<html lang="en">
  {% include head.html %}
  <body>
    <div class="container">
      {% include nav.html %}

      {% if page.hero_image %}
        <div class="hero hero--image" style="background-image: url('{{ page.hero_image | relative_url }}');">
          <div class="hero__inner">
            {% if page.hero_title %}<h1 class="hero-title">{{ page.hero_title }}</h1>{% endif %}
            {% if page.hero_subtitle %}<p class="muted">{{ page.hero_subtitle }}</p>{% endif %}
          </div>
        </div>
      {% endif %}

      {{ content }}

      {% include footer.html %}
    </div>

    <!-- Lightbox (must be inside body) -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <div class="lightbox__backdrop" data-close></div>
      <img class="lightbox__img" id="lightboxImg" alt="">
      <div class="lightbox__counter" id="lightboxCounter">1 / 1</div>
      <button class="lightbox__btn lightbox__close" type="button" data-close aria-label="Close">×</button>
      <button class="lightbox__btn lightbox__prev" type="button" data-prev aria-label="Previous">‹</button>
      <button class="lightbox__btn lightbox__next" type="button" data-next aria-label="Next">›</button>
    </div>

    <!-- Load JS after markup so it can bind properly -->
    <script src="{{ '/assets/js/lightbox.js' | relative_url }}" defer></script>
  </body>
</html>
